<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAS — Selecție · probe fizice</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SAS">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --card3:#3A3A3C; --sep:#2C2C2E;
  --text:#FFFFFF; --text2:#8E8E93; --text3:#636366;
  --blue:#0A84FF; --blue2:#64D2FF; --green:#30D158; --redx:#FF453A; --red2:#FF6961;
  --orange:#FF9F0A; --purple:#BF5AF2;
  --ok:#30D158; --red:#FF453A; --mute:#8E8E93; --mute2:#636366; --bone:#FFFFFF; --void:#000000; --line2:#2C2C2E;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;letter-spacing:-.01em}
h1,h2,h3{margin:0}
.mono{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 116px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button{font-family:inherit;color:inherit}
.hide{display:none!important}

#intro{position:fixed;inset:0;z-index:120;background:var(--bg);display:grid;place-items:center;transition:opacity .5s ease;cursor:pointer}
#intro.gone{opacity:0;pointer-events:none}
#intro .bars{display:none}
#intro .c{text-align:center;padding:0 24px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#intro .mk{width:76px;height:76px}
#intro .w{font-family:var(--round);font-weight:800;line-height:1;margin-top:18px}
#intro .r{height:4px;width:36px;border-radius:2px;background:var(--blue);margin:16px auto 0}
#intro .s{font-size:14px;color:var(--text2);margin-top:14px}
@media (prefers-reduced-motion:reduce){#intro .c{animation:none}}

.topbar{position:sticky;top:0;z-index:40;background:rgba(0,0,0,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--card)}
.topbar-in{max-width:720px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px}
.ttl{font-family:var(--round);font-weight:800;line-height:1}
.sub{font-size:12px;color:var(--text2);margin-top:3px}
.pill{margin-left:auto;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--blue);color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}

.tabs{position:sticky;top:57px;z-index:30;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{max-width:720px;margin:0 auto;padding:10px 12px;display:flex;gap:8px}
.tab{background:var(--card);border:0;color:var(--text2);cursor:pointer;font-weight:600;font-size:14px;padding:8px 15px;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
.tab.on{background:#fff;color:#000}

.panel{background:var(--card);border-radius:18px;padding:18px;margin-top:12px}
.pt{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px;line-height:1.2}
.muted{color:var(--text2);font-size:14px;margin:0}

.hero{background:var(--card);border-radius:22px;padding:22px;margin-top:14px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.gauge{flex:none;text-align:center;min-width:104px}
.gauge b{font-family:var(--round);font-weight:700;font-size:78px;line-height:.9;display:block;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.gauge span{font-size:13px;color:var(--text2);display:block;margin-top:6px}
.hbody{flex:1;min-width:200px}
.hbody h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.vd{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.vd.ok{background:rgba(48,209,88,.18);color:var(--green)}
.vd.mid{background:rgba(10,132,255,.2);color:var(--blue2)}
.vd.bad{background:rgba(255,69,58,.18);color:var(--red2)}
.vd.none{background:var(--card2);color:var(--text2)}
.wkstrip{display:flex;gap:4px;width:100%;margin-top:2px}
.wkstrip i{flex:1;height:6px;border-radius:3px;background:var(--card2)}
.wkstrip i.past{background:#48484A}
.wkstrip i.now{background:var(--blue)}

.prio{display:flex;gap:14px;padding:14px 0;border-bottom:.5px solid var(--sep)}
.prio:last-child{border-bottom:none}
.prio .r{font-family:var(--round);font-size:26px;font-weight:700;line-height:1;color:var(--blue);width:22px;flex:none}
.prio .r.off{color:var(--text3)}
.prio h3{font-size:16px;font-weight:600;line-height:1.25}
.prio p{font-size:14px;color:var(--text2);margin:5px 0 0;line-height:1.5}
.prio b{color:var(--text);font-weight:600}

.pr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--sep)}
.pr:last-child{border-bottom:none}
.pr .tg{font-family:var(--round);font-size:12px;font-weight:700;width:34px;height:30px;display:grid;place-items:center;background:var(--card2);color:var(--text2);border-radius:9px;flex:none}
.pr .nm{font-weight:600;font-size:15px}
.pr .mt{font-size:13px;color:var(--text2);margin-top:2px;line-height:1.4}
.pr .vv{margin-left:auto;font-family:var(--round);font-size:15px;font-weight:700;padding:4px 10px;border-radius:9px;background:var(--card2);color:var(--text2);font-variant-numeric:tabular-nums}
.pr .vv.hit{background:rgba(48,209,88,.18);color:var(--green)}
.pr .vv.miss{background:rgba(255,69,58,.16);color:var(--red2)}

.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 8px;text-align:right;border-bottom:.5px solid var(--sep)}
.tbl th{color:var(--text3);font-weight:500;font-size:12px}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl td{color:var(--text2)}
.tbl td:first-child{color:var(--text)}
.tbl td.k{color:var(--text);font-weight:600}
.tbl tr.hi td{background:rgba(10,132,255,.16);color:#fff}
.tbl tr.hi td:first-child{border-radius:10px 0 0 10px}
.tbl tr.hi td:last-child{border-radius:0 10px 10px 0}
.tbl tr:last-child td{border-bottom:none}

.ph{background:var(--card);border-radius:18px;margin-top:10px;overflow:hidden}
.ph-h{width:100%;border:0;background:none;cursor:pointer;padding:16px;display:flex;align-items:center;gap:14px;text-align:left}
.ph-n{font-family:var(--round);font-weight:700;font-size:15px;width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--card2);color:var(--text2);transition:.2s}
.ph.open .ph-n{background:var(--blue);color:#fff}
.ph-t{font-size:17px;font-weight:600}
.ph-w{font-size:13px;color:var(--text2);margin-top:2px}
.chev{margin-left:auto;color:var(--text3);width:18px;height:18px;flex:none;transition:transform .3s}
.ph.open .chev,.day.open .chev{transform:rotate(180deg)}
.ph-b{max-height:0;overflow:hidden;transition:max-height .35s ease}
.ph.open .ph-b{max-height:2400px}
.ph-i{padding:0 16px 16px 62px}
.ln{padding:11px 0;border-top:.5px solid var(--sep)}
.ln b{font-size:14px;font-weight:600}
.ln p{font-size:14px;color:var(--text2);margin:4px 0 0;line-height:1.5}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{background:var(--card);border:0;color:var(--text2);font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.2s;font-variant-numeric:tabular-nums}
.chip.on{background:#fff;color:#000}

.pbh{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin:16px 2px 7px;font-variant-numeric:tabular-nums}
.pb{height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.pb > i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .5s cubic-bezier(.2,.7,.2,1)}

.day{background:var(--card);border-radius:18px;margin-top:10px;overflow:hidden}
.day.today{box-shadow:inset 0 0 0 1.5px var(--blue)}
.day.rest{opacity:.5}
.day-h{width:100%;border:0;background:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left}
.dring{width:38px;height:38px;flex:none}
.dring text{fill:var(--text2);font-size:10.5px;font-weight:700;font-family:var(--round)}
.day-b{flex:1;min-width:0}
.day-l{font-size:12px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:7px}
.day-l em{font-style:normal;background:var(--blue);color:#fff;padding:1px 8px;border-radius:999px;font-size:11px}
.day-t{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-top:2px;line-height:1.25}
.day-m{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.wtag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.wtag.hard{background:rgba(255,69,58,.18);color:var(--red2)}
.wtag.power{background:rgba(10,132,255,.2);color:var(--blue2)}
.wtag.cal{background:rgba(191,90,242,.2);color:#DA8FFF}
.wtag.easy{background:rgba(48,209,88,.16);color:var(--green)}
.wtag.rest{background:var(--card2);color:var(--text2)}
.wtag.loc{background:transparent;box-shadow:inset 0 0 0 1px #48484A;color:var(--text2)}
.day-dt{font-size:12px;color:var(--text3)}
.day-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.day.open .day-body,.day.always .day-body{max-height:4000px}
.exl{padding:0 16px 12px;border-top:.5px solid var(--sep)}
.ex{padding:13px 0;border-bottom:.5px solid var(--sep)}
.ex:last-of-type{border-bottom:none}
.ex-top{display:flex;align-items:flex-start;gap:12px}
.ex-t{flex:1;min-width:0;border:0;background:none;cursor:pointer;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:0}
.ex-bx{width:22px;height:22px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 1.5px #48484A;display:grid;place-items:center;margin-top:0;transition:.2s}
.ex-bx svg{width:13px;height:13px;stroke-width:3.5;color:#000;opacity:0}
.ex.on .ex-bx{background:var(--green);box-shadow:none}
.ex.on .ex-bx svg{opacity:1}
.ex-n{display:block;font-size:15px;font-weight:600}
.ex.on .ex-n{color:var(--text3)}
.ex-d{display:block;font-size:13px;color:var(--text2);margin-top:3px;line-height:1.45}
.ex-alt{display:block;font-size:13px;color:var(--orange);margin-top:4px;line-height:1.45}
.locb{display:inline-block;font-size:11px;font-weight:600;background:var(--card2);color:var(--text2);padding:1px 8px;border-radius:999px;margin-left:7px;vertical-align:1px}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 34px}
.setin{width:64px;background:var(--card2);border:1px solid transparent;color:#fff;font-family:var(--round);font-weight:600;font-size:15px;padding:8px 4px;text-align:center;border-radius:11px;outline:none;font-variant-numeric:tabular-nums;transition:.15s}
.setin::placeholder{color:var(--text3)}
.setin:focus{border-color:var(--blue)}
.setin.good{border-color:rgba(48,209,88,.6);color:var(--green);background:rgba(48,209,88,.1)}
.setin.bad{border-color:rgba(255,69,58,.5);color:var(--red2)}
.foot{font-size:13px;color:var(--text2);line-height:1.55;padding:12px 0 2px;border-top:.5px solid var(--sep)}
.foot b{color:var(--text);font-weight:600}

.clk{font-family:var(--round);font-weight:700;font-size:86px;line-height:.95;text-align:center;margin:10px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stn{text-align:center;font-size:20px;font-weight:600;margin-top:6px}
.stt{text-align:center;font-size:13px;color:var(--text2)}
.btns{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:16px}
.btn{border:0;background:var(--card2);color:#fff;font-weight:600;font-size:15px;padding:13px;cursor:pointer;border-radius:13px;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.solid{background:#fff;color:#000}
.btn.red{background:var(--blue);color:#fff}
.btn.ghost{background:transparent;color:var(--text2)}
.lap{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:.5px solid var(--sep);font-size:14px;color:var(--text2);font-variant-numeric:tabular-nums}
.lap b{color:var(--text);font-weight:600}
.lap.over b{color:var(--red2)}
.lap.under b{color:var(--green)}

#dock{position:fixed;right:16px;bottom:20px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#dockMenu{background:var(--card2);border-radius:18px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;box-shadow:0 12px 40px rgba(0,0,0,.7);max-width:240px;justify-content:flex-end}
#dockMenu button{background:var(--card3);border:0;color:#fff;font-size:14px;font-weight:600;padding:9px 12px;cursor:pointer;border-radius:11px;font-variant-numeric:tabular-nums}
#dockBtn{background:var(--blue);color:#fff;border:0;font-family:var(--round);font-size:20px;font-weight:700;padding:0 20px;height:54px;min-width:98px;border-radius:999px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.65);font-variant-numeric:tabular-nums}
#dockBtn.idle{background:#fff;color:#000;font-family:var(--sans);font-size:15px;font-weight:600}
#dockBtn.done{background:var(--green);color:#000}

.inp{background:var(--card2);border:1px solid transparent;color:#fff;font-size:16px;padding:11px 13px;width:100%;outline:none;border-radius:12px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.inp:focus{border-color:var(--blue)}
.inp::placeholder{color:var(--text3)}
.row{display:flex;gap:8px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:18px;padding:14px}
.stat .k{font-size:12px;font-weight:600;color:var(--text2)}
.stat .v{font-family:var(--round);font-size:30px;font-weight:700;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--sans);font-size:13px;color:var(--text2);font-weight:500}

.note{background:rgba(10,132,255,.12);border-radius:14px;padding:14px 16px;margin-top:12px;font-size:14px;color:#C7C7CC;line-height:1.55}
.note b{color:#fff;font-weight:600}
.note.good{background:rgba(48,209,88,.12)}
.note.neutral{background:var(--card2)}
.klist{list-style:none;padding:0;margin:8px 0 0}
.klist li{font-size:14px;padding:6px 0 6px 18px;position:relative;color:var(--text2);line-height:1.5}
.klist li:before{content:'';position:absolute;left:2px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.klist b{color:var(--text);font-weight:600}
.bigline{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.bigline small{font-size:13px;color:var(--text2);display:block;margin-top:5px;font-weight:400;letter-spacing:0}
</style>
</head>

  <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>

    <div class="w" style="font-size:76px;letter-spacing:.02em">SAS</div>

</div>

<div class="topbar"><div class="topbar-in">
  <svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="8" fill="#000000"/><path d="M24 3.5 L41.5 9.5 V24.5 C41.5 34 33.5 41.5 24 44.5 C14.5 41.5 6.5 34 6.5 24.5 V9.5 Z" fill="#FFFFFF"/><path d="M13 16.5 L24 22.5 L35 16.5 L35 23 L24 29 L13 23 Z" fill="#000000"/><path d="M13 26.5 L24 32.5 L35 26.5 L35 33 L24 39 L13 33 Z" fill="#0A84FF"/></svg>

</div></div>

<script>
/* ===== storage ===== */
const mem={};
const DB={
  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k);if(r&&r.value)return JSON.parse(r.value);return null;} }catch(e){}
    try{ const v=localStorage.getItem(k);return v?JSON.parse(v):(mem[k]??null); }catch(e){ return mem[k]??null; }
  },
  async set(k,v){
    mem[k]=v;
    try{ if(window.storage){await window.storage.set(k,JSON.stringify(v));return;} }catch(e){}
    try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){}
  }
};
let S={ex:{},log:{},open:{},probes:{},hist:[],max:{}};
const save=()=>DB.set("ultimastatie3.state",S);

const I={
 chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
};

/* ===== date ===== */
const TARGET=new Date(2026,10,10,8,0,0), W1=new Date(2026,8,21), D=864e5;
const DN=["Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă","Duminică"];
const MN=["ian","feb","mar","apr","mai","iun","iul","aug","sept","oct","nov","dec"];
const daysLeft=()=>Math.max(0,Math.ceil((TARGET-new Date())/D));
const dateOf=(w,i)=>new Date(W1.getTime()+((w-1)*7+i)*D);
const fmt=d=>d.getDate()+" "+MN[d.getMonth()];
const isToday=d=>d.toDateString()===new Date().toDateString();
const dayOffset=()=>Math.floor((new Date().setHours(12,0,0,0)-new Date(W1).setHours(12,0,0,0))/D);
function todayIdx(){const o=dayOffset();if(o<0||o>50)return null;return{w:Math.floor(o/7)+1,i:o%7};}
const curWeek=()=>{const t=todayIdx();return t?t.w:(dayOffset()<0?1:8);};
const mmss=s=>{s=Math.round(s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");};
function parseVal(str){
  str=(str||"").trim().replace(",",".");if(!str)return null;
  if(str.includes(":")){const p=str.split(":");return (+p[0])*60+(+p[1]);}
  const v=parseFloat(str);return isNaN(v)?null:v;
}
const showVal=(v,u)=>v==null?"":(u==="t"?mmss(v):String(v));

/* ===== baza zilnică calculată ===== */
function baseToday(){
  const fm=S.max.flot, dm=S.max.dips, t=todayIdx();
  const i=t?t.i:0;
  const noPush=(i===3)||(t&&t.w===6&&(i===3||i===5));
  const failDay=(i===2||i===4);
  const out=[];
  if(noPush){
    out.push({n:"Flotări — pauză",d:"Azi nu faci flotări. E singura zi din săptămână și e obligatorie."});
  }else if(failDay){
    out.push({n:"Flotări — zi de cedare",d:fm?`O serie unică până la cedare (reper ${fm}), apoi 4 clustere cu 7 s pauză.`:"O serie unică până la cedare, apoi 4 clustere cu 7 s pauză. Treci maximul în Cifre ca să-ți calculez seriile."});
  }else{
    const sub=fm?Math.round(fm*.55):null;
    out.push({n:"Flotări — volum submaximal",d:sub?`5 × ${sub} repetări, pauză 90 s. Oprești departe de cedare.`:"5 serii la ~55% din maxim, pauză 90 s. Treci maximul în Cifre ca să-ți calculez seriile."});
  }
  out.push({n:"Abdomene — respirație blocată pe repetare",d:"3 × 30, ritm rar și egal. Expirație completă pe urcare, inspirație pe nas pe coborâre. Pauză 90 s între serii."});
  out.push({n:"Expirație completă — 2 × 30 respirații",d:"Culcat, genunchii îndoiți: expiri tot aerul, ultimele 3 secunde forțat din abdomen, apoi inspiri pe nas. De două ori pe zi, oriunde."});
  if(!noPush) out.push({n:"Dips GTG",d:dm?`4–5 × ${Math.max(1,Math.round(dm*.5))} repetări împrăștiate în zi, unde ai bare. Acasă: flotări priză îngustă cu picioarele ridicate, 4 × 8.`:"4–5 serii scurte la jumătate din maxim, unde ai bare. Acasă: flotări priză îngustă cu picioarele ridicate, 4 × 8."});
  out.push({n:"Atârnat GTG",d:"3 × 30–40 s împrăștiate în zi, fără cedare. Doar unde ai bară."});
  out.push({n:"Mobilitate",d:"5 min șold și torace."});
  return out;
}

function exByKey(k){const p=k.split("-").map(Number),wk=WEEKS.find(x=>x.n===p[0]);return wk&&wk.days[p[1]]?wk.days[p[1]].ex[p[2]]:null;}

function pRow(p){

function vZile(){
  const w=WEEKS.find(x=>x.n===selW);

  return `
  <div class="chips">${WEEKS.map(x=>`<button class="chip${x.n===selW?" on":""}" data-w="${x.n}">S${x.n}</button>`).join("")}</div>

  <div class="pb"><i style="width:${total?done/total*100:0}%"></i></div>
  ${w.days.map((d,i)=>dayCard(w,d,i)).join("")}`;
}
function dayCard(w,d,i,always){
  const dt=dateOf(w.n,i),today=isToday(dt);
  let dn=0;d.ex.forEach((e,j)=>{if(S.ex[`${w.n}-${i}-${j}`])dn++;});
  const pct=d.ex.length?dn/d.ex.length:0,C=2*Math.PI*12,open=S.open[`d${w.n}-${i}`];
  const lbl={hard:"greu",easy:"ușor",power:"putere",cal:"test",rest:"liber"}[d.tag];
  return `<div class="day${today?" today":""}${d.tag==="rest"?" rest":""}${open?" open":""}${always?" always":""}" data-day="${w.n}-${i}">
    <button class="day-h">
      <svg class="dring" viewBox="0 0 30 30">
        <circle cx="15" cy="15" r="12" fill="none" stroke="#2C2C2E" stroke-width="3.5"/>
        <circle cx="15" cy="15" r="12" fill="none" stroke="${pct>=1?"#30D158":"#0A84FF"}" stroke-width="3.5"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" stroke-linecap="round" transform="rotate(-90 15 15)"/>
        <text x="15" y="19" text-anchor="middle">${dn}</text></svg>
      <div class="day-b">
        <div class="day-l">${DN[i]}${today?"<em>azi</em>":""}</div>
        <div class="day-t">${d.t}</div>
        <div class="day-m"><span class="wtag ${d.tag}">${lbl}</span>${d.loc?`<span class="wtag loc">${d.loc}</span>`:""}<span class="day-dt">${fmt(dt)}</span></div>
      </div>
      <div class="chev">${I.chev}</div>
    </button>
    <div class="day-body"><div class="exl">
      ${d.ex.map((e,j)=>exRow(w.n,i,j,e)).join("")}
      ${d.f?`<div class="foot">${d.f}</div>`:""}
    </div></div></div>`;
}
function exRow(wn,i,j,e){
  const key=`${wn}-${i}-${j}`,on=S.ex[key],arr=S.log[key]||[];
  let sets="";
  if(e.s){
    sets=`<div class="sets">${Array.from({length:e.s},(_,k)=>{
      const v=arr[k];let cls="";
      if(v!=null&&e.tv!=null){const good=e.low?v<=e.tv:v>=e.tv;cls=good?"good":"bad";}
      return `<input class="setin ${cls}" data-log="${key}|${k}" inputmode="${e.u==="t"?"text":"decimal"}"
        placeholder="${e.tv!=null?showVal(e.tv,e.u):"—"}" value="${v!=null?showVal(v,e.u):""}">`;}).join("")}</div>`;
  }
  return `<div class="ex${on?" on":""}"><div class="ex-top">
    <button class="ex-t" data-ex="${key}">
      <span class="ex-bx">${I.check}</span>
      <span><span class="ex-n">${e.n}${e.bar?'<span class="locb">bară</span>':""}</span>${e.d?`<span class="ex-d">${e.d}</span>`:""}${e.alt?`<span class="ex-alt">${e.alt}</span>`:""}</span>
    </button></div>${sets}</div>`;
}

const tac=(t,p)=>`<div class="prio"><div class="r off">·</div><div><h3>${t}</h3><p>${p}</p></div></div>`;
function lapsHtml(){
  if(!laps.length)return '<p class="muted" style="font-size:12.5px">Apasă „Stație gata" după fiecare stație. Splitul se compară cu ritmul orientativ.</p>';
  let prev=0;

}

    "Meta-analiza a 15 studii nu a găsit nicio diferență între antrenamentul până la cedare și cel oprit înainte, nici pentru forță, nici pentru masă musculară. Acolo unde volumul nu a fost egalat, seriile oprite înainte de cedare au produs câștiguri de forță mai mari.",

  ${E("Forța grea bate pliometria pentru economia alergării","fix",
    "Comparație directă: efectul forței grele asupra economiei alergării e mic dar real (g = −0,32), al pliometriei e neglijabil (g = −0,13). Separat, antrenamentul izometric al flexorilor plantari a produs îmbunătățiri de 4–7% ale economiei. <b>Corecție aplicată:</b> am adăugat izometrii de gambă de 30–40 s lângă ridicările pe vârfuri, și am ținut săriturile la minimul cerut de probă — la 125 kg pliometria e cost, nu beneficiu.",
    "Eihara et al., Sports Medicine – Open, 2022 · Lum et al., pe izometrie")}
  ${E("Taperul: volum jos, frecvență neschimbată","fix",
    "Strategia optimă e reducerea volumului cu 41–60%, cu intensitatea și <b>frecvența păstrate</b>. Reducerea frecvenței dă un efect mai slab. Durata: până în 21 de zile, cu 8–14 zile ca fereastră tipică. Taperul precedat de o săptămână de supraîncărcare e superior celui obișnuit. <b>Corecție aplicată:</b> joia din S7 nu mai e zi liberă, ci o ședință scurtă — păstrezi șase zile de antrenament, doar mult mai ușoare.",
    "Bosquet et al., Medicine & Science in Sports & Exercise, 2007 · Wang et al., PLOS One, 2023")}
  ${E("Interferența dintre forță și alergare e mică, dar reală","ok",
    "Meta-analizele moderne arată interferență mică pe forța maximă și aproape deloc pe masă musculară — dar efectul apare mai ales când cele două se fac în aceeași ședință (ES −0,66) și aproape dispare când sunt separate (ES −0,10). Alergarea interferează mai mult decât ciclismul, din cauza componentei excentrice. Separarea recomandată: minimum 3 ore, ideal 6.",
    "Schumann et al., Sports Medicine, 2022 · Petré et al., 2021 · Wilson et al., JSCR, 2012")}
  ${E("Ramatul și bike-ul: mențin, nu construiesc","fix",
    "Meta-analiza din 2026 nu a găsit nici îmbunătățiri, nici scăderi clare ale VO2max specific alergării sau ale performanței la alergare după antrenament încrucișat. Capacitatea aerobă centrală se transferă; economia alergării și toleranța la impact <b>nu</b>. <b>Corecție aplicată:</b> ziua fără impact rămâne ca asigurare contra accidentării, dar dacă în S3 nu ai niciun semnal la tibie sau Ahile, adaugi 15 minute de alergare ușoară la începutul ei.",
    "Menges et al., Frontiers in Sports and Active Living, 2026")}
  ${E("Greutatea: 2 secunde pe kilogram se confirmă","ok",
    "Estimările converg pe 1,25–3 secunde pe kilometru pentru fiecare kilogram, iar „regula de 1%\" (1% din masă = 1% din timp) dă la tine ~2 secunde pe kilogram la 1000 m. Reducerea masei inactive a îmbunătățit semnificativ timpul pe 3 km într-un studiu cu încărcare controlată. Condiția: să fie grăsime, nu mușchi.",
    "Studii de încărcare externă · recenzii despre greutatea de concurs")}
  ${E("Pașii mai deși scad riscul de fractură de stres","fix",
    "Scurtarea pasului cu 10% reduce încărcarea musculo-scheletică, deformarea tibiei și riscul estimat de fractură de stres, indiferent de înălțime. <b>Corecție aplicată:</b> la fiecare alergare, cadență cu 5–10% peste cea naturală. Nu costă nimic și la 2 metri și 125 kg e cea mai ieftină asigurare pe care o ai.",
    "studiu pe biomecanica lungimii pasului, 2023")}
  ${E("Tura de noapte taie puterea 24 de ore","fix",
    "Restricția de somn la ~4 ore scade puterea maximă și motivația de a te antrena atât la 12, cât și la 24 de ore după — fără ca markerii de distrugere musculară să crească. Adică pierzi calitatea ședinței, nu te distrugi. <b>Regulă aplicată:</b> după tura de noapte pui ziua de recuperare sau stațiile tehnice, niciodată intervalele lungi sau simularea.",
    "Rae et al., 2017 · recenzii despre somn și performanță")}
  </div>

  <div class="panel"><div class="pt">Reguli de programare</div>
  <ul class="klist">
    <li><b>Minimum 6 ore</b> între alergarea grea și ședința de forță, dacă pică în aceeași zi. Dacă nu se poate, forța prima.</li>
    <li><b>Niciodată intervale lungi după tura de noapte.</b> Acolo mută recuperarea sau stațiile tehnice.</li>
    <li><b>Cadență cu 5–10% peste natural</b> la fiecare alergare, toată perioada.</li>
    <li><b>Greutatea se scade în S1–S4</b>, nu după. Din S5 mănânci ca să susții ședințele, nu ca să slăbești.</li>
    <li><b>Durere punctuală pe os</b> (tibie, laba piciorului) care apare la alergat și persistă la mers: oprești alergarea imediat și treci totul pe ramat. Nu e ceva ce se „aleargă până trece".</li>
  </ul></div>`;
}

/* ===== cronometru de pauză ===== */
let rEnd=null,rTick=null;
function paintDock(){
  const b=$("#dockBtn");
  if(rEnd==null){b.className="idle";b.textContent="Pauză";return;}
  const left=Math.max(0,Math.round((rEnd-Date.now())/1000));
  if(left<=0){b.className="done";b.textContent="GATA";
    if(rTick){clearInterval(rTick);rTick=null;}
    try{navigator.vibrate&&navigator.vibrate([200,80,200]);}catch(e){}
    setTimeout(()=>{rEnd=null;paintDock();},3000);return;}
  b.className="";b.textContent=mmss(left);
}
function startRest(sec){
  rEnd=Date.now()+sec*1000;
  if(rTick)clearInterval(rTick);
  rTick=setInterval(paintDock,250);paintDock();
  $("#dockMenu").classList.add("hide");
}
$("#dockMenu").innerHTML=[45,60,90,120,150,180].map(s=>`<button data-rest="${s}">${s<60?s+" s":(s/60)+" min"}</button>`).join("");
$("#dockMenu").querySelectorAll("[data-rest]").forEach(b=>b.onclick=()=>startRest(+b.dataset.rest));
$("#dockBtn").onclick=()=>{
  if(rEnd!=null){rEnd=null;if(rTick)clearInterval(rTick);rTick=null;paintDock();return;}
  $("#dockMenu").classList.toggle("hide");
};

/* ===== render ===== */
function render(){
  const v=$("#view");
  v.innerHTML={azi:vAzi,brief:vBrief,plan:vPlan,zile:vZile,ritm:vRitm,circuit:vCircuit,dovezi:vDovezi,cifre:vCifre,proba:vProba}[view]();
  $("#pill").textContent=daysLeft()+" zile · 10 nov";

  v.querySelectorAll("[data-ph] .ph-h").forEach(b=>b.onclick=async()=>{
    const k=b.parentElement.dataset.ph;S.open[k]=!S.open[k];b.parentElement.classList.toggle("open");await save();});
  v.querySelectorAll(".chip[data-w]").forEach(b=>b.onclick=()=>{selW=+b.dataset.w;render();});
  v.querySelectorAll(".day .day-h").forEach(b=>b.onclick=async()=>{
    const c=b.parentElement;if(c.classList.contains("always"))return;
    S.open["d"+c.dataset.day]=!S.open["d"+c.dataset.day];c.classList.toggle("open");await save();});
  v.querySelectorAll("[data-ex]").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();const k=b.dataset.ex;S.ex[k]=!S.ex[k];await save();
    b.closest(".ex").classList.toggle("on");
    const card=b.closest(".day");if(card)refreshRing(card);});
  v.querySelectorAll("[data-log]").forEach(inp=>{
    inp.onchange=async()=>{
      const parts=inp.dataset.log.split("|"),key=parts[0],idx=+parts[1];
      const ex=exByKey(key),val=parseVal(inp.value);
      S.log[key]=S.log[key]||[];S.log[key][idx]=val;await save();
      inp.classList.remove("good","bad");
      if(val!=null&&ex&&ex.tv!=null) inp.classList.add((ex.low?val<=ex.tv:val>=ex.tv)?"good":"bad");
      if(val!=null&&ex&&ex.u==="t") inp.value=mmss(val);
    };});
  v.querySelectorAll("[data-sv]").forEach(b=>b.onclick=async()=>{
    const k=b.dataset.sv,val=parseVal(v.querySelector(`input[data-p="${k}"]`).value);
    if(val==null)return;S.probes[k]=val;await save();render();});

  const bm=v.querySelector("#bMax");
  if(bm)bm.onclick=async()=>{
    const f=parseVal(v.querySelector("#mxFlot").value),dp=parseVal(v.querySelector("#mxDips").value);
    if(f!=null)S.max.flot=f;if(dp!=null)S.max.dips=dp;await save();render();};

  const be=v.querySelector("#bExp");
  if(be)be.onclick=()=>{const t=v.querySelector("#ioBox");t.style.display="block";t.value=JSON.stringify(S);t.select();};
  const bi=v.querySelector("#bImp");
  if(bi)bi.onclick=async()=>{
    const t=v.querySelector("#ioBox");
    if(t.style.display==="none"||!t.value.trim()){t.style.display="block";t.placeholder="lipești aici datele și apeși din nou Importă";return;}
    try{const o=JSON.parse(t.value);S=Object.assign({ex:{},log:{},open:{},probes:{},hist:[],max:{}},o);await save();render();}catch(e){t.value="Date invalide.";}};
  const bw=v.querySelector("#bWipe");
  if(bw)bw.onclick=async()=>{S={ex:{},log:{},open:{},probes:{},hist:[],max:{}};await save();render();};

  const bs=v.querySelector("#bStart");
  if(bs)bs.onclick=()=>{
    if(t0){clearInterval(tid);t0=null;render();return;}
    t0=Date.now();laps=[];
    tid=setInterval(()=>{const c=document.querySelector("#clk");if(c)c.textContent=mmss((Date.now()-t0)/1000);},200);
    render();};
  const bl=v.querySelector("#bLap");
  if(bl)bl.onclick=async()=>{
    if(!t0||laps.length>=STATION.length)return;
    laps.push((Date.now()-t0)/1000);
    if(laps.length===STATION.length){
      clearInterval(tid);const tot=laps[laps.length-1];t0=null;
      S.hist.unshift({d:new Date().toLocaleDateString("ro-RO"),t:Math.round(tot)});
      S.hist=S.hist.slice(0,20);await save();}
    render();};
  const br=v.querySelector("#bReset");
  if(br)br.onclick=()=>{clearInterval(tid);t0=null;laps=[];render();};
}
function refreshRing(card){
  const p=card.dataset.day.split("-").map(Number);
  const wk=WEEKS.find(x=>x.n===p[0]),d=wk.days[p[1]];
  let dn=0;d.ex.forEach((e,j)=>{if(S.ex[`${p[0]}-${p[1]}-${j}`])dn++;});
  const pct=dn/d.ex.length,C=2*Math.PI*12;
  const c=card.querySelectorAll(".dring circle")[1],t=card.querySelector(".dring text");
  if(c){c.setAttribute("stroke-dashoffset",C*(1-pct));c.setAttribute("stroke",pct>=1?"#30D158":"#0A84FF");}
  if(t)t.textContent=dn;
}

/* ===== boot ===== */
(async function(){
  const s=await DB.get("ultimastatie3.state");
  if(s&&typeof s==="object")S=Object.assign({ex:{},log:{},open:{},probes:{},hist:[],max:{}},s);
  selW=curWeek();paintTabs();render();paintDock();
  const it=$("#intro"),kill=()=>it.classList.add("gone");
  it.onclick=kill;setTimeout(kill,2100);
  setInterval(()=>{$("#pill").textContent=daysLeft()+" zile · 10 nov";},60000);
})();
</script>
